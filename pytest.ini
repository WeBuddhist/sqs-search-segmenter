[pytest]
# Pytest configuration for SQS Search Segmenter

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Verbose output
    -v
    # Show print statements
    -s
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on unknown config keys
    --strict-config
    # Coverage options
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Disable warnings summary
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests that test individual functions/classes
    integration: Integration tests that test multiple components
    slow: Tests that take longer to run
    neo4j: Tests that require Neo4j database
    milvus: Tests that require Milvus vector database
    firebase: Tests that require Firebase/Storage
    sqs: Tests that require SQS

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    */utils/sqs_utils.py

[coverage:report]
# Fail if coverage is below this percentage
fail_under = 70
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod

